<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Page</title>

<style>

body{
background:#fdeff2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
overflow:hidden;
}

.card{
background:white;
width:350px;
padding:40px;
border-radius:30px;
text-align:center;
position:relative;
}

h2{
color:#008cff;
font-size:40px;
}

.buttons-container {
display: flex;
justify-content: center;
gap: 15px; /* May pagitan ang mga buttons */
margin-top: 20px;
}

button{
border:none;
padding:15px 35px;
border-radius:30px;
cursor:pointer;
font-size:20px;
transition: 0.2s ease;
}

.yes{
background:#008cff;
color:white;
}

/* Style para sa No button */
.no{
background:#cccccc;
color:#333333;
}

.hidden{
display:none;
}

#hearts{
position:absolute;
left:50%;
bottom:90px;
pointer-events:none;
}

.heart{
position:absolute;
font-size:24px;
animation:float 2s linear forwards;
}

@keyframes float{

0%{
transform:translateY(0) scale(1);
opacity:1;
}

100%{
transform:translateY(-350px)
translateX(calc(var(--x)*1px))
scale(1.5);

opacity:0;
}

}

</style>
</head>

<body>

<div class="card">

<div id="page1">

<h2>Hi ganda</h2>

<p>Babyyyyy sorry na po, wag na po magalit.<br>Bati na po tayo?</p>

<div class="buttons-container">
<button class="yes" onclick="showPage2()">
Yes
</button>

<button id="noBtn" class="no" onclick="disagree()">
No
</button>
</div>

</div>

<div id="page2" class="hidden">

<h2>Yeeyyyyy! Bati na tayo ha</h2>
<h3>I love you so much babyyyy💕</h3>


<button class="yes" onclick="spawnHearts()">
Mwaaaa!
</button>


</div>

<div id="hearts"></div>

</div>

<script>

function showPage2(){
document.getElementById("page1").classList.add("hidden");
document.getElementById("page2").classList.remove("hidden");
}

// Bagong function para sa No button
function disagree(){
alert("Bawal mag no! 😤"); // Lalabas ang popup message
document.getElementById("noBtn").style.display = "none"; // Mawawala ang No button
}

function spawnHearts(){
const container = document.getElementById("hearts");

for(let i=0;i<15;i++){
let heart = document.createElement("div");
heart.className="heart";
heart.innerHTML="😘❤️";

heart.style.setProperty('--x', (Math.random()*200)-100);
heart.style.left= (Math.random()*50)+"px";

container.appendChild(heart);

setTimeout(()=>{
heart.remove();
},2000);
}
}

</script>

</body>
</html>
